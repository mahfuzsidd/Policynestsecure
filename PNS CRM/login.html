<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - PolicyNest Secure Private Limited</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lightbg: '#f0fdf4',
                        glasslight: 'rgba(255, 255, 255, 0.85)',
                        glassborder: 'rgba(20, 184, 166, 0.25)',
                        tealaccent: '#0d9488',
                        goldaccent: '#d97706',
                    },
                    boxShadow: {
                        'glasslight': '0 20px 40px -15px rgba(13, 148, 136, 0.12), 0 0 15px rgba(255, 255, 255, 0.9) inset',
                        'goldglow': '0 0 20px -3px rgba(217, 119, 6, 0.3)',
                        'tealglow': '0 0 20px -3px rgba(13, 148, 136, 0.25)',
                        'card3d': '0 15px 35px -5px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(13, 148, 136, 0.1)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at 10% 10%, #e6f9f0 0%, #f1f8f5 50%, #e3ede8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            padding: 1rem;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(20, 184, 166, 0.3);
            box-shadow: 0 20px 40px -10px rgba(13, 148, 136, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(13, 148, 136, 0.3);
            color: #0f172a;
        }
        .glass-input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 15px rgba(13, 148, 136, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 right-6 z-50 transform -translate-y-28 opacity-0 transition-all duration-300 px-5 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3 text-xs font-bold border border-teal-500/30 bg-white/95 backdrop-blur-2xl text-slate-900">
        <i id="toast-icon" class="fas fa-check-circle text-emerald-600 text-base"></i>
        <span id="toast-msg">Notification message</span>
    </div>

    <!-- Login Card Container -->
    <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-card3d space-y-6">
        
        <!-- Company Branding & Logo -->
        <div class="flex flex-col items-center text-center space-y-2 border-b border-teal-500/20 pb-5">
            <img src="https://drive.google.com/uc?export=view&id=1HyN_g5ZtfrzaU8zG07VqR2EFDvMV2v0-" alt="PolicyNest Logo" class="w-14 h-14 rounded-2xl object-cover border-2 border-teal-600 shadow-goldglow" onerror="this.src='https://via.placeholder.com/56?text=PN'">
            <div>
                <h1 class="font-extrabold text-base tracking-tight text-slate-900">PolicyNest Secure</h1>
                <p class="text-[11px] text-teal-700 font-extrabold tracking-wider uppercase">Private Limited</p>
            </div>
        </div>

        <!-- Role Selector Tabs -->
        <div class="grid grid-cols-2 gap-2 p-1.5 bg-teal-900/5 rounded-2xl border border-teal-500/20">
            <button type="button" onclick="setRole('employee')" id="tab-employee" class="py-2.5 rounded-xl text-xs font-extrabold transition-all bg-teal-600 text-white shadow-tealglow">
                <i class="fas fa-user-tie mr-1.5"></i> Employee
            </button>
            <button type="button" onclick="setRole('admin')" id="tab-admin" class="py-2.5 rounded-xl text-xs font-extrabold transition-all text-slate-700 hover:text-teal-900">
                <i class="fas fa-shield-alt mr-1.5"></i> Admin
            </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <input type="hidden" id="selected-role" value="employee">

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Username / ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-teal-700"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" required placeholder="Enter username" class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-xs font-semibold">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Security Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-teal-700"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" required placeholder="Enter password" class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-xs font-semibold">
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-extrabold rounded-xl text-xs hover:from-amber-600 transition shadow-goldglow flex items-center justify-center gap-2 mt-2">
                <i class="fas fa-sign-in-alt"></i> Login to Portal
            </button>
        </form>

        <div class="text-center pt-2">
            <p class="text-[11px] font-bold text-slate-500">PolicyNest Secure Private Limited</p>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "YOUR_APPS_SCRIPT_DEPLOYMENT_URL_HERE";

        function setRole(role) {
            document.getElementById('selected-role').value = role;
            const empTab = document.getElementById('tab-employee');
            const adminTab = document.getElementById('tab-admin');
            
            if (role === 'employee') {
                empTab.className = "py-2.5 rounded-xl text-xs font-extrabold transition-all bg-teal-600 text-white shadow-tealglow";
                adminTab.className = "py-2.5 rounded-xl text-xs font-extrabold transition-all text-slate-700 hover:text-teal-900";
            } else {
                adminTab.className = "py-2.5 rounded-xl text-xs font-extrabold transition-all bg-teal-600 text-white shadow-tealglow";
                empTab.className = "py-2.5 rounded-xl text-xs font-extrabold transition-all text-slate-700 hover:text-teal-900";
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            document.getElementById('toast-icon').className = type === 'success' 
                ? 'fas fa-check-circle text-emerald-600 text-base' : 'fas fa-exclamation-circle text-red-600 text-base';
            toast.classList.remove('-translate-y-28', 'opacity-0');
            setTimeout(() => toast.classList.add('-translate-y-28', 'opacity-0'), 4000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Verifying...`;
            btn.disabled = true;

            const payload = {
                action: "login",
                role: document.getElementById('selected-role').value,
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.result === 'success') {
                    showToast('Login successful! Redirecting...');
                    localStorage.setItem('policynest_user', JSON.stringify({
                        loggedIn: true,
                        role: result.role,
                        name: result.name
                    }));
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showToast(result.message || 'Invalid credentials!', 'error');
                    btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Login to Portal`;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showToast('Connection error! Please check network.', 'error');
                btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Login to Portal`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
